# Spiel-Freunde: statische Seite auf DigitalOcean App Platform.
# Kein Build. Die fertige Seite liegt in public/.
# error_document und catchall_document dürfen nicht gleichzeitig gesetzt sein.
# Eigene Cache-Control-Header unterstützt die Static-Site-Komponente nicht
# (CDN etwa 24 Stunden, Browser etwa 10 Sekunden, geleert bei jedem Redeploy).
# Die Skat-Stimmen cachen sich zusätzlich im Browser (Cache Storage).
#
# Functions-Komponente api: Quelle api/, Route /api.
# Paket sf (benannt, damit project.yml Umgebungsvariablen tragen darf).
# Pfade danach /api/sf/chat, /api/sf/tts und /api/sf/avatar.
# Jede Funktion bringt handlers.js selbst mit. main ist index.main.
# SECRET-Werte hier leer lassen. Echte Schlüssel nur im Dashboard.
# Vor doctl apps update die verschlüsselten Werte aus `doctl apps spec get` übernehmen.
name: spiel-freunde
region: fra

static_sites:
  - name: web
    github:
      repo: mike20082015/spiel-freunde
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: html
    output_dir: public
    index_document: index.html
    error_document: 404.html

functions:
  - name: api
    github:
      repo: mike20082015/spiel-freunde
      branch: main
      deploy_on_push: true
    source_dir: api
    routes:
      - path: /api
    envs:
      - key: XAI_MODEL
        value: grok-4.3
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: XAI_IMAGE_MODEL
        value: grok-imagine-image-2.0
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: AVATAR_DAILY_LIMIT
        value: "30"
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: ELEVEN_MODEL
        value: eleven_v3
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: VOICE_MARGARETHE
        value: 28LWddKi67H2YN9L2PvK
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: VOICE_HORST
        value: ""
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: VOICE_URS
        value: BfwuiKSWxqDOcSYQr6EC
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: VOICE_VRENI
        value: 4yZGYlR0JpmqiCxBgPi5
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: DAILY_LIMIT
        value: "400"
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: XAI_API_KEY
        value: ""
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ELEVENLABS_API_KEY
        value: ""
        scope: RUN_AND_BUILD_TIME
        type: SECRET

# Web-Service für den privaten Skat-Tisch.
# Eine Instanz: die Tische liegen im Speicher. Mehr Instanzen würden die Runden spalten.
# Route /api/tisch, dazu WebSocket /api/tisch/ws.
# Keine Schlüssel. Chat und Stimmen bleiben an der Function api.
# TISCH_ADMIN_TOKEN und TISCH_DATA_DIR bewusst nicht hier: solange sie fehlen,
# bleibt die programmatische Turnier-Route zu und Ergebnisse leben im Prozess.
# Für ein späteres K.-o. den Token als SECRET nur an dieser Komponente setzen
# und den ResultStore an eine Datenbank hängen. Nichts davon ins Frontend,
# nichts in api/project.yml.
# Image aus tisch/Dockerfile, Kontext ist die Repository-Wurzel.
# room.js braucht public/skat/js/engine.js und ai.js. Mit source_dir tisch
# fehlen die Dateien und der Prozess stirbt mit MODULE_NOT_FOUND.
# Start ist das CMD im Image (node tisch/server.js), Port 8080.
# Kein Buildpack und kein run_command: der würde das CMD ersetzen.
services:
  - name: tisch
    github:
      repo: mike20082015/spiel-freunde
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: tisch/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api/tisch
    health_check:
      http_path: /health
