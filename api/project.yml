# DigitalOcean Functions. Werte kommen beim Bauen aus den Umgebungsvariablen
# der Komponente (App Platform, Scope RUN_AND_BUILD_TIME). Keine Schlüssel hier.
# Der Eintrag main nennt Datei und Export, also index.main.
# Ein Dateiname an dieser Stelle sucht einen Export namens js, der Aufruf stirbt dann vorher.
packages:
  - name: sf
    environment:
      XAI_API_KEY: "${XAI_API_KEY}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY}"
      XAI_MODEL: "${XAI_MODEL}"
      XAI_IMAGE_MODEL: "${XAI_IMAGE_MODEL}"
      AVATAR_DAILY_LIMIT: "${AVATAR_DAILY_LIMIT}"
      VOICE_HORST: "${VOICE_HORST}"
      VOICE_MARGARETHE: "${VOICE_MARGARETHE}"
      VOICE_URS: "${VOICE_URS}"
      VOICE_VRENI: "${VOICE_VRENI}"
      VOICE_SEPP: "${VOICE_SEPP}"
      VOICE_HILDE: "${VOICE_HILDE}"
      VOICE_LENA: "${VOICE_LENA}"
      VOICE_JONAS: "${VOICE_JONAS}"
      VOICE_OEMER: "${VOICE_OEMER}"
      VOICE_RUEDIGER: "${VOICE_RUEDIGER}"
      VOICE_CHANTAL: "${VOICE_CHANTAL}"
      ELEVEN_MODEL: "${ELEVEN_MODEL}"
      DAILY_LIMIT: "${DAILY_LIMIT}"
    functions:
      - name: chat
        runtime: nodejs:22
        web: true
        main: index.main
        limits:
          timeout: 12000
          memory: 128
      - name: tts
        runtime: nodejs:22
        web: true
        main: index.main
        limits:
          timeout: 15000
          memory: 128
      - name: avatar
        runtime: nodejs:22
        web: true
        main: index.main
        limits:
          timeout: 30000
          memory: 128
