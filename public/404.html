<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden · Spiel-Freunde</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/variante-a-favicon-dunkel.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .miss{min-height:100vh;display:flex;flex-direction:column;background:
    radial-gradient(ellipse at 70% 20%,rgba(255,170,80,.16),transparent 55%),
    linear-gradient(165deg,#3d2616,#24160c 60%,#1c120b);color:var(--cream)}
  .miss-main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px 72px}
  .miss-card{max-width:560px;text-align:center}
  .miss-card h1{font-size:clamp(2rem,4vw,3rem);margin:18px 0 12px}
  .miss-card p{color:rgba(247,241,227,.82);margin-bottom:26px}
  .miss-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .miss .nav{position:relative}
</style>
</head>
<body class="miss">
<header class="nav">
  <div class="wrap nav-in">
    <div class="nav-brand">
      <a class="logo" href="/" aria-label="Spiel-Freunde Startseite"><img src="/assets/variante-a-lockup-dunkel-web.svg" alt="Spiel-Freunde" width="796" height="175"></a>
      <span class="preview-badge">Vorschau</span>
    </div>
    <div class="nav-cta">
      <a class="btn btn-gold btn-sm" href="/skat/">Jetzt Skat ausprobieren</a>
    </div>
  </div>
</header>
<main class="miss-main">
  <div class="miss-card">
    <p class="kicker"><span class="dot"></span> Fehler 404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Der Link führt ins Leere. Geh zurück zur Startseite oder setz Dich direkt an den Skattisch.</p>
    <div class="miss-actions">
      <a class="btn btn-gold btn-lg" href="/">Zur Startseite</a>
      <a class="btn btn-line btn-lg" href="/skat/">Jetzt Skat ausprobieren</a>
    </div>
  </div>
</main>
</body>
</html>
